[package]
name = "opengdt-bridge"
description = "Die Bridge: GDT-Anforderung → DICOM-Worklist, DICOM-Bilder → Dateien + GDT-Rückmeldung"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "opengdt-bridge"
path = "src/main.rs"

[dependencies]
opengdt-gdt = { path = "../gdt" }
opengdt-dicom = { path = "../dicom" }
opengdt-worklist = { path = "../worklist" }
opengdt-store = { path = "../store" }
opengdt-convert = { path = "../convert" }
opengdt-json = { path = "../json" }

[lib]
name = "opengdt_bridge"
path = "src/lib.rs"

[dev-dependencies]
opengdt-profile = { path = "../profile" }
