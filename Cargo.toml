[workspace]
resolver = "2"
members = [
    "crates/gdt",
    "crates/dicom",
    "crates/worklist",
    "crates/store",
    "crates/convert",
    "crates/bridge",
    "crates/json",
    "crates/profile",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
# Geprüft: Build und Tests mit 1.82 (1.81 scheitert an Option::is_none_or/iter::repeat_n); Entwicklung mit aktuellem stable.
rust-version = "1.82"

# Grundregel: keine externen Crates. Nur `std`.
