[workspace]
resolver = "2"
members = [
    "crates/gdt",
    "crates/dicom",
    "crates/worklist",
    "crates/store",
    "crates/convert",
    "crates/bridge",
    "crates/profile",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

# Grundregel: keine externen Crates. Nur `std`.
