# OpenGDT-Bridge im Container. Pfade liegen unter /data (Bind-Mount von ./data auf dem Host).
# Einzelne Werte lassen sich per Umgebung überschreiben: OPENGDT_<SCHLÜSSEL>, siehe docker-compose.yml.

ae_title = OPENGDT
listen = 0.0.0.0:11112

# GDT-Austausch mit dem PVS (GNUmed liest/schreibt diese Ordner auf dem Host: ./data/gdt-in, ./data/gdt-out)
gdt_import_dir = /data/gdt-in
gdt_export_dir = /data/gdt-out
gdt_keep_processed = true

# Worklist: dieselben Dateien liest das Worklist-Plugin von Orthanc (./data/worklists)
worklist_dir = /data/worklists
modality = US

archive_dir = /data/archive
export_dir = /data/export
settle_seconds = 3
multiframe = video

# Orthanc ist der DICOM-Server für das Gerät; die Bridge holt fertige Untersuchungen per REST ab
orthanc_url = http://orthanc:8042
orthanc_poll_seconds = 2
