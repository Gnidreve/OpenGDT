# Kompletter Entwicklungs-/Teststack:  docker compose up -d --build
#
#   Ultraschall (DP-50) ──DICOM──▶ orthanc :4242   Worklist (Plugin) + Bildempfang
#   PVS (GNUmed, auf dem Host) ◀─GDT-Dateien─▶ ./data/gdt-in, ./data/gdt-out ◀──▶ bridge
#   bridge ──REST──▶ orthanc :8042   (holt fertige Untersuchungen, schreibt Bilder + GDT-Rückmeldung)
#
# Einstellungen (alle optional) in der Datei .env, Vorlage: .env.example
name: opengdt

services:
  # Einmaliger Init-Schritt (endet danach): Datenordner mit den richtigen Besitzrechten, Orthanc-Konfiguration
  # und Zugangsdaten (zufällig erzeugt, siehe docker/init.sh).
  init:
    image: ${RUNTIME_IMAGE:-debian:bookworm-slim}
    user: "0:0"
    command: ["sh", "/init.sh"]
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      ORTHANC_ADMIN_PASSWORD: ${ORTHANC_ADMIN_PASSWORD:-}
      ORTHANC_BRIDGE_PASSWORD: ${ORTHANC_BRIDGE_PASSWORD:-}
    volumes:
      - ./data:/data
      - ./docker/init.sh:/init.sh:ro
      - ./docker/orthanc/orthanc.json:/static/orthanc.json:ro
      - orthanc-config:/config
      - bridge-secrets:/bridge-secrets
      - gnumed-secrets:/gnumed-secrets
    restart: "no"

  orthanc:
    image: ${ORTHANC_IMAGE:-orthancteam/orthanc:latest}
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      WORKLISTS_PLUGIN_ENABLED: "true"                    # Plugin-Bibliothek im Image aktivieren (Einstellungen: docker/orthanc/orthanc.json)
    ports:
      - "4242:4242"                                       # DICOM: hier verbindet sich das Ultraschallgerät
      - "127.0.0.1:80:8042"                               # Weboberfläche/REST nur auf dem Pi selbst (Port 80 fest): http://localhost
    volumes:
      - orthanc-config:/etc/orthanc:ro                    # orthanc.json + credentials.json (vom Init-Schritt)
      - orthanc-db:/var/lib/orthanc/db
      - ./data/worklists:/worklists:ro

  bridge:
    build:
      context: .
      args:
        RUST_IMAGE: ${RUST_IMAGE:-rust:1-slim-bookworm}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-debian:bookworm-slim}
    image: opengdt-bridge:local
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      init:
        condition: service_completed_successfully
      orthanc:
        condition: service_started
    ports:
      - "11112:11112"          # eigener DICOM-Listener der Bridge (Alternative zu Orthanc, siehe docker/README.md)
    healthcheck:             # häufig prüfen, damit `info` seine Ausgabe schnell nach dem Start zeigen kann
      test: ["CMD", "opengdt-bridge", "echo", "127.0.0.1:11112"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    environment:
      OPENGDT_UTC_OFFSET_MINUTES: ${UTC_OFFSET_MINUTES:-60}
      OPENGDT_STATION_AE: ${DEVICE_AE:-}
      OPENGDT_PVS_EXPORT_PREFIX: ${PVS_EXPORT_PREFIX:-${PWD}/data/export}
      OPENGDT_GDT_RESULT_FILENAME: ${GDT_RESULT_FILENAME:-}
      OPENGDT_ORTHANC_USER: bridge
      OPENGDT_ORTHANC_PASSWORD_FILE: /secrets/orthanc-password
    volumes:
      - ./data:/data
      - bridge-secrets:/secrets:ro

  # GNUmed-Datenbank (PostgreSQL 15; der GNUmed-Client auf dem Pi verbindet sich mit localhost:5432). Der Bootstrap-Schritt
  # darunter legt beim ersten Start das Schema an (einige Minuten) und tut danach nichts mehr. Zurücksetzen: docker compose down -v
  gnumed-db:
    image: ${GNUMED_DB_IMAGE:-postgres:15}               # nicht 16: der GNUmed-22-Bootstrap läuft dort nicht (geprüft)
    # Einstellungen, die der GNUmed-Client am Datenbankserver erwartet (sonst erscheint ein Hinweis beim Start des Clients)
    command: ["postgres", "-c", "log_connections=on", "-c", "log_disconnections=on", "-c", "track_commit_timestamp=on"]
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_PASSWORD_FILE: /secrets/postgres-password
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8 --encoding=UTF8
    ports:
      - "127.0.0.1:5432:5432"                             # nur auf dem Pi selbst (GNUmed-Client)
    volumes:
      - gnumed-db:/var/lib/postgresql/data
      - gnumed-secrets:/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

  gnumed-bootstrap:
    build:
      context: ./docker/gnumed
      args:
        BASE_IMAGE: ${GNUMED_BASE_IMAGE:-ubuntu:24.04}
    image: opengdt-gnumed-bootstrap:local
    depends_on:
      gnumed-db:
        condition: service_healthy
    environment:
      PGHOST: gnumed-db
    volumes:
      - gnumed-secrets:/secrets:ro
    restart: "no"

  # Gibt nach dem Start alle Zugangs-/Verbindungsdaten aus (siehe docker/banner.sh) und endet danach.
  info:
    image: ${RUNTIME_IMAGE:-debian:bookworm-slim}
    network_mode: host                         # nur um die IP-Adresse des Pi zu ermitteln
    command: ["bash", "/banner.sh"]
    environment:
      HOST_DATA_DIR: ${PWD}/data
      PVS_EXPORT_PREFIX: ${PVS_EXPORT_PREFIX:-${PWD}/data/export}
      DEVICE_AE: ${DEVICE_AE:-}
      GDT_RESULT_FILENAME: ${GDT_RESULT_FILENAME:-}
    volumes:
      - ./docker/banner.sh:/banner.sh:ro
      - orthanc-config:/config:ro
      - gnumed-secrets:/gnumed-secrets:ro
    depends_on:
      orthanc:
        condition: service_started
      bridge:
        condition: service_healthy
      gnumed-bootstrap:
        condition: service_completed_successfully
    restart: "no"

volumes:
  orthanc-db:
  orthanc-config:
  bridge-secrets:
  gnumed-db:
  gnumed-secrets:
